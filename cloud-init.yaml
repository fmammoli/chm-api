#cloud-config
package_update: true
package_upgrade: false
packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - git
  - ufw
write_files:
  - path: /opt/deploy.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      APP_DIR="/opt/chm-api"
      REPO_URL="https://github.com/fmammoli/chm-api.git"
      BRANCH="main"

      sudo apt-get update
      sudo apt-get install -y ca-certificates curl gnupg git ufw

      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      echo \
        "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
        $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
        sudo tee /etc/apt/sources.list.d/docker.list > /dev/null

      sudo apt-get update
      sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
      sudo systemctl enable docker
      sudo systemctl start docker
      sudo usermod -aG docker "$USER"

      sudo ufw allow OpenSSH
      sudo ufw allow 80/tcp
      sudo ufw --force enable

      sudo mkdir -p "$APP_DIR"
      cd "$APP_DIR"
      if [ ! -d .git ]; then
        sudo git clone -b "$BRANCH" "$REPO_URL" .
      else
        sudo git fetch origin "$BRANCH"
        sudo git checkout "$BRANCH"
        sudo git pull origin "$BRANCH"
      fi

      cat > .env <<EOF
      CHM_API_KEY=${CHM_API_KEY:-${API_KEY:-replace-with-strong-random-secret}}
      REQUIRE_API_KEY=true
      CORS_ORIGINS=["https://beyond-carbon-webgis.vercel.app","http://localhost:3000"]
      TRUSTED_HOSTS=["localhost","127.0.0.1","beyond-carbon-webgis.vercel.app"]
      MAX_GEOJSON_BYTES=1000000
      MAX_AOI_AREA_KM2=1200
      AOI_SQUARE_SIDE_KM=30
      MAX_VERTICES=50000
      MAX_TILES_PER_REQUEST=16
      DOWNLOAD_WORKERS=2
      MAX_CONCURRENT_CHM_JOBS=1
      MAX_PENDING_CHM_JOBS=6
      RATE_LIMIT_PER_MINUTE=30
      EOF

      sudo docker compose up -d --build

      echo "Deployment complete"
      echo "Check http://$(curl -s ifconfig.me)/health"
  - path: /etc/caddy/Caddyfile
    permissions: '0644'
    content: |
      {
        admin off
      }

      :80 {
        reverse_proxy chm-api:8000
      }
runcmd:
  - ["bash", "/opt/deploy.sh"]
