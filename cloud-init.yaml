#cloud-config
package_update: true
package_upgrade: false
packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - git
  - ufw
write_files:
  - path: /opt/deploy.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      APP_DIR="/opt/chm-api"
      REPO_URL="https://github.com/your-username/your-repo.git"
      BRANCH="main"
      DOMAIN="api.example.com"
      EMAIL="you@example.com"

      sudo apt-get update
      sudo apt-get install -y ca-certificates curl gnupg git ufw

      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      echo \
        "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
        $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
        sudo tee /etc/apt/sources.list.d/docker.list > /dev/null

      sudo apt-get update
      sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
      sudo systemctl enable docker
      sudo systemctl start docker
      sudo usermod -aG docker "$USER"

      sudo ufw allow OpenSSH
      sudo ufw allow 80/tcp
      sudo ufw allow 443/tcp
      sudo ufw --force enable

      sudo mkdir -p "$APP_DIR"
      cd "$APP_DIR"
      if [ ! -d .git ]; then
        sudo git clone -b "$BRANCH" "$REPO_URL" .
      else
        sudo git fetch origin "$BRANCH"
        sudo git checkout "$BRANCH"
        sudo git pull origin "$BRANCH"
      fi

      cat > .env <<EOF
      API_KEY=replace-with-strong-random-secret
      REQUIRE_API_KEY=true
      CORS_ORIGINS=["https://your-frontend.example.com"]
      TRUSTED_HOSTS=["localhost","127.0.0.1","$DOMAIN"]
      MAX_GEOJSON_BYTES=1000000
      MAX_AOI_AREA_KM2=250000
      MAX_VERTICES=50000
      MAX_TILES_PER_REQUEST=128
      DOWNLOAD_WORKERS=6
      RATE_LIMIT_PER_MINUTE=30
      EOF

      sudo sed -i "s/api.example.com/$DOMAIN/g" Caddyfile
      sudo sed -i "s/you@example.com/$EMAIL/g" Caddyfile

      sudo docker compose up -d --build

      echo "Deployment complete"
      echo "Check https://$DOMAIN/health"
  - path: /etc/caddy/Caddyfile
    permissions: '0644'
    content: |
      {
        admin off
      }

      :80 {
        reverse_proxy chm-api:8000
      }
runcmd:
  - ["bash", "/opt/deploy.sh"]
